[project]
name = "mirofast-backend"
version = "1.0.0"
description = "MiroFast - Laya-decided swarm simulation (Laya decisions + LLM-only-for-prose + Neo4j)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFast" }
]

dependencies = [
    # Decision engine (System 1: action choice, stance, sentiment, moderation)
    "laya>=0.3.11",

    # Core framework
    "flask>=3.0.0",
    "flask-cors>=6.0.0",

    # Generation LLM
    "openai>=1.0.0",

    # Neo4j graph database driver
    "neo4j>=5.15.0",

    # OASIS social media simulation
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    "mcp==1.9.4",

    # File processing
    "PyMuPDF>=1.24.0",
    # Encoding detection (non-UTF-8 text files)
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]